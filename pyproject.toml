[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neemseo"
version = "0.1.0"
description = "neemSEO: An all-in-one, open-source SEO tool and alternative to Semrush/Ahrefs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "neemSEO Team"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
neemseo = "neemseo.cli.main:app"

[tool.setuptools.packages.find]
include = ["neemseo*"]

[tool.ruff]
line-length = 100
target-version = "py310"
