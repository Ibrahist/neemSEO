name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate

      - name: Destroy Preview Worker & D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          WORKER_NAME="neemseo-preview-pr-${PR_NUM}"
          DB_NAME="neemseo-preview-d1-pr-${PR_NUM}"

          echo "Deleting preview worker $WORKER_NAME..."
          pnpm dlx wrangler delete --name "$WORKER_NAME" --force || true

          echo "Deleting preview D1 database $DB_NAME..."
          pnpm dlx wrangler d1 delete "$DB_NAME" --skip-confirmation || true

      - name: Comment PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🧹 Preview environment destroyed for PR #' + context.issue.number
            });

  preview-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenNext Cloudflare bundle
        run: pnpm build:cf

      - name: Create Ephemeral D1 Database & Apply Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          DB_NAME="neemseo-preview-d1-pr-${PR_NUM}"
          echo "Provisioning D1 database $DB_NAME..."
          pnpm dlx wrangler d1 create "$DB_NAME" || true
          pnpm dlx wrangler d1 migrations apply "$DB_NAME" --remote || true

      - name: Deploy Preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          WORKER_NAME="neemseo-preview-pr-${PR_NUM}"
          OUTPUT=$(pnpm dlx wrangler deploy --name "$WORKER_NAME")
          echo "$OUTPUT"
          PREVIEW_URL=$(echo "$OUTPUT" | grep -o 'https://[^ ]*\.workers\.dev' | head -n 1)
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Comment Preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = process.env.PREVIEW_URL || `https://neemseo-preview-pr-${prNumber}.workers.dev`;
            const commentBody = `### 🚀 neemSEO Preview Environment Ready!\n\n` +
              `- **Preview URL:** [${previewUrl}](${previewUrl})\n` +
              `- **Commit:** \`${context.sha.substring(0, 7)}\`\n` +
              `- **Mode:** \`local_noauth\`\n\n` +
              `> This preview runs on an isolated Cloudflare Worker and D1 database. It will be destroyed automatically when this pull request closes.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body.includes('neemSEO Preview Environment Ready'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
