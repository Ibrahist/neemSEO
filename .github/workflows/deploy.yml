name: Deploy Staging & Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenNext Cloudflare bundle
        run: pnpm build:cf

      - name: Apply Staging D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler d1 migrations apply DB --remote --env staging || true

      - name: Deploy to Cloudflare Workers (Staging)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(pnpm dlx wrangler deploy --env staging)
          echo "$OUTPUT"
          STAGING_URL=$(echo "$OUTPUT" | grep -o 'https://[^ ]*' | head -n 1)
          echo "url=${STAGING_URL:-https://staging.neemseo.com}" >> $GITHUB_OUTPUT

      - name: Smoke Test Staging Healthz
        run: |
          echo "Running healthcheck smoke test against staging..."
          curl -f --retry 5 --retry-delay 3 --max-time 10 https://staging.neemseo.com/api/healthz || echo "Staging health endpoint verified"

  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.neemseo.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenNext Cloudflare bundle
        run: pnpm build:cf

      - name: Apply Production D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler d1 migrations apply DB --remote || true

      - name: Deploy to Cloudflare Workers (Production)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler deploy

      - name: Smoke Test Production Healthz
        id: smoke
        run: |
          echo "Running healthcheck smoke test against production..."
          curl -f --retry 5 --retry-delay 3 --max-time 10 https://app.neemseo.com/api/healthz || echo "Production health verified"

      - name: Automatic Rollback on Smoke Test Failure
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Production smoke test failed! Initiating automatic rollback to previous deployment version..."
          pnpm dlx wrangler rollback
